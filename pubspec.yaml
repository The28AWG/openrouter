name: openrouter
description: Typed Dart client for the OpenRouter API. Models and service methods are generated from the official OpenAPI document.
version: 1.0.1
repository: https://github.com/The28AWG/openrouter

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
